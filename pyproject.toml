[project]
name = "printwatch"
version = "0.1.0"
description = "Local printer camera wall and digital signage"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "httpx>=0.28,<1",
    "websockets>=14,<17",
    "python-multipart>=0.0.20,<1",
    "cryptography>=44",
    "pillow>=11,<13",
    "pypdfium2>=4.30,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
